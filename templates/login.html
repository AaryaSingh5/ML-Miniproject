<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Climate Hazard Intelligence System - Sign In</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary-blue: #0284c7;
            --primary-hover: #0369a1;
            --error-red: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        .login-card {
            background: var(--card-bg); width: 100%; max-width: 420px;
            padding: 40px; border-radius: 16px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); text-align: center;
        }

        .brand-icon {
            width: 48px; height: 48px; background: #e0f2fe; color: var(--primary-blue);
            border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; margin-bottom: 16px;
        }

        .app-title { font-size: 20px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        .app-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; line-height: 1.4; }

        .form-group { text-align: left; margin-bottom: 18px; }
        label { font-size: 13px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
            font-size: 14px; background: #fafafa; color: var(--text-dark); transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary-blue); background: #fff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

        .btn-login {
            width: 100%; background: var(--primary-blue); color: white;
            padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 10px; transition: background 0.2s;
        }
        .btn-login:hover { background: var(--primary-hover); }

        .error-message {
            background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px;
            font-size: 13px; margin-bottom: 18px; font-weight: 500;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-icon">🌡️</div>
    <h1 class="app-title">AI Climate Hazard Intelligence System</h1>
    <p class="app-subtitle">Heat Risk & Disaster Assessment Portal</p>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="form-group">
            <label>Username / Officer ID</label>
            <input type="text" name="username" placeholder="Enter username" required autocomplete="off">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login">Sign In to Dashboard</button>
    </form>
</div>

</body>
</html>
